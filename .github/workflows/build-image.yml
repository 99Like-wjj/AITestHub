name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build private release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the declared Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install the declared pnpm version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const metadata = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(metadata.packageManager, /^pnpm@[0-9]+\.[0-9]+\.[0-9]+$/);
          assert.equal(process.versions.node, metadata.engines.node);
          execFileSync('npm', ['install', '--global', metadata.packageManager, '--ignore-scripts', '--no-audit', '--no-fund'], { stdio: 'inherit' });
          NODE
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tooling/local-client --ignore-workspace install --frozen-lockfile
      - name: Check formatting and types
        run: pnpm quality:check
      - name: Check private registry destination
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/actions/build-release.mjs prepare
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish candidate
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aitesthub-linux-amd64
          cache-to: type=gha,mode=max,scope=aitesthub-linux-amd64
          provenance: false
      - name: Verify private package and prepare immutable release proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AITESTHUB_RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node deploy/actions/build-release.mjs manifest
      - name: Save release proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aitesthub-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitesthub-release/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
