services:
  api:
    image: aitesthub-app:0.1.0-local
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_started }
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      AITESTHUB_DB_PASSWORD_FILE: /run/secrets/postgres_app_password
      AITESTHUB_S3_ENDPOINT: http://seaweedfs:8333
      AITESTHUB_S3_ACCESS_KEY_FILE: /run/secrets/s3_app_access
      AITESTHUB_S3_SECRET_KEY_FILE: /run/secrets/s3_app_secret
      AITESTHUB_MASTER_KEY_FILE: /run/secrets/platform_master_key
      AITESTHUB_API_WORKER_BOOTSTRAP_FILE: /run/secrets/api_worker_bootstrap
      AITESTHUB_PRIVACY_LEDGER_DIRECTORY: /var/lib/aitesthub-control/privacy-deletions
      AITESTHUB_REQUIRE_RECOVERY_CONTROL: 'true'
      AITESTHUB_RECOVERY_CONTROL_DIRECTORY: /var/lib/aitesthub-control/security-controls
      AITESTHUB_RECOVERY_CONTROL_ANCHOR_FILE: /var/lib/aitesthub-anchors/security-control-anchor.json
      AITESTHUB_RECOVERY_CONTROL_KEY_FILE: /run/secrets/recovery_control_key
      AITESTHUB_BACKUP_DIRECTORY: /var/lib/aitesthub-backups/product
      AITESTHUB_PUBLIC_ORIGIN: http://127.0.0.1:5300
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    secrets:
      [
        postgres_app_password,
        s3_app_access,
        s3_app_secret,
        platform_master_key,
        api_worker_bootstrap,
        recovery_control_key,
      ]
    ports: ['127.0.0.1:5300:5300']
    networks: [default, api-control]
    volumes:
      - ${AITESTHUB_LOCAL_ROOT}/control/privacy-deletions:/var/lib/aitesthub-control/privacy-deletions
      - ${AITESTHUB_LOCAL_ROOT}/control/security-controls:/var/lib/aitesthub-control/security-controls
      - ${AITESTHUB_LOCAL_ROOT}/recovery/controls:/var/lib/aitesthub-anchors
      - ${AITESTHUB_LOCAL_ROOT}/recovery/controls/resource-policy:/var/lib/aitesthub-anchors/resource-policy:ro
    read_only: true
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5300/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
secrets:
  recovery_control_key:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/recovery-control-key
  api_worker_bootstrap:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/api-worker-bootstrap
  platform_master_key:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/platform-master-key
  s3_app_access:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/s3-app-access
  s3_app_secret:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/s3-app-secret
networks:
  api-control:
    internal: true
