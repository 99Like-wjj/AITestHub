name: aitesthub-local

# Foundation only. Product Web/API/MCP/AI/execution services are developed in the next chat.
services:
  postgres:
    image: ${AITESTHUB_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: aitesthub
      POSTGRES_USER: aitesthub_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - postgres_app_password
    ports:
      - '127.0.0.1:${AITESTHUB_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - type: bind
        source: ${AITESTHUB_LOCAL_ROOT}/backups
        target: /local-backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aitesthub_admin -d aitesthub']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  seaweedfs:
    image: ${AITESTHUB_SEAWEED_IMAGE:-chrislusf/seaweedfs:4.53}
    restart: unless-stopped
    working_dir: /data
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/run/secrets/s3_iam
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.volumeSizeLimitMB=1024
      # Reserve slots for both the S3 bucket collection and filer system-log collection.
      # This is a volume-count ceiling, not preallocated disk space.
      - -volume.max=32
      - -volume.minFreeSpace=10GiB
    secrets: [s3_iam]
    ports:
      - '127.0.0.1:${AITESTHUB_S3_PORT:-58333}:8333'
    volumes: [seaweed_data:/data]
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

secrets:
  postgres_admin_password:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/postgres-admin-password
  postgres_app_password:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/postgres-app-password
  s3_iam:
    file: ${AITESTHUB_LOCAL_ROOT}/secrets/s3-iam.json

volumes:
  postgres_data:
    name: aitesthub_local_postgres_data
  seaweed_data:
    name: aitesthub_local_seaweed_data
